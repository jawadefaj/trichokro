        /* ============================================
           COMPREHENSIVE MOBILE & DESKTOP OPTIMIZATION
           ============================================ */

        /* 1. Enhanced Global Styles with Mobile Support */
        body { 
            cursor: default; 
            overflow-x: hidden; 
            background-color: #020617; 
            font-family: 'Inter', sans-serif; 
            color: #e2e8f0; 
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 2. Add NEW ANIMATIONS for more motion (keep all existing ones) */
        @keyframes shimmer { 
            0% { background-position: -1000px 0; } 
            100% { background-position: 1000px 0; } 
        }
        @keyframes glow-pulse { 
            0%, 100% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.3)); } 
            50% { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.7)); } 
        }
        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes rotate-center {
            0% { transform: rotateZ(0deg); }
            50% { transform: rotateZ(180deg); }
            100% { transform: rotateZ(360deg); }
        }
        @keyframes border-glow {
            0%, 100% { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.8); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        }

        /* 3. Animation Classes */
        .animate-shimmer { animation: shimmer 2s infinite; }
        .animate-glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }
        .animate-slide-down { animation: slide-down 0.6s ease-out; }
        .animate-scale-in { animation: scale-in 0.5s ease-out; }
        .animate-rotate-center { animation: rotate-center 4s linear infinite; }
        .animate-border-glow { animation: border-glow 2.5s ease-in-out infinite; }

        /* 4. Mobile Optimizations */
        @media (max-width: 768px) {
            /* Disable heavy animations on mobile for performance */
            .tilt-card { transform-style: flat !important; }
            .uplift-on-hover:hover { transform: scale(1.02) !important; }
            
            /* Simplify animations on mobile */
            .animate-float-medium { animation: float-medium 8s ease-in-out infinite; }
            .animate-float-slow { animation: float-slow 8s ease-in-out infinite; }
            
            /* Touch-friendly spacing */
            button, a, .interactive { 
                min-height: 44px; 
                min-width: 44px;
                padding: 12px 16px;
            }
            
            /* Reduce navbar padding on mobile */
            nav { padding: 12px 0 !important; }
            nav .max-w-7xl { padding: 0 12px !important; }
            
            /* Mobile-friendly text sizes */
            h1 { font-size: 2rem !important; }
            h2 { font-size: 1.5rem !important; }
            
            /* Disable complex transforms */
            #hero-grid { opacity: 0.03 !important; }
            .watermark-logo { opacity: 0.3 !important; z-index: -1 !important; pointer-events: none !important; }
            
            /* Hide mouse-only elements */
            #cursor-gradient { display: none !important; }
            
            /* Improve scroll performance */
            * { will-change: auto; }
            [data-animate] { will-change: opacity; }
        }

        /* 5. Desktop Enhanced Animations and Interactions */
        @media (min-width: 769px) {
            /* Enable full animations on desktop */
            .card { animation: scale-in 0.6s ease-out; }
            .interactive:hover { animation: glow-pulse 0.6s ease-in-out; }
            
            /* Smooth transitions for desktop */
            * { transition: background-color 0.3s ease; }
            
            /* Enhanced hover states */
            a:hover, button:hover { transform: translateY(-2px); }
        }

        /* 6. Touch-Friendly Interactive Elements */
        .interactive, [onclick], button, a {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
            padding: min(0.5rem, 4vw);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .interactive:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        /* 7. Responsive Container Optimizations */
        .container {
            padding: 16px;
        }

        @media (min-width: 640px) {
            .container { padding: 24px; }
        }

        @media (min-width: 1024px) {
            .container { padding: 32px; }
        }

        /* 8. Performance Optimizations */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 9. Enhanced Loading Performance */
        img {
            will-change: transform;
            backface-visibility: hidden;
        }

        video {
            will-change: transform;
        }

        /* 10. Mobile Navigation Improvements */
        @media (max-width: 768px) {
            #mobile-menu {
                max-height: 100vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            #mobile-menu a {
                display: block;
                padding: 16px;
                min-height: 48px;
                border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            }
        }

        /* 11. Improved Scrolling Behavior */
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        /* 12. Better Touch States for Buttons */
        @media (hover: none) and (pointer: coarse) {
            /* Mobile-specific touch states */
            button:active, a:active, .interactive:active {
                background-color: rgba(16, 185, 129, 0.2);
                transform: scale(0.97);
            }
        }

        /* 13. Viewport Meta Optimization */
        @viewport {
            width: device-width;

        }

        }

<script id="trichokro-news-article-render">

 const raw=window.TC_NEWS||[], translations=window.TC_NEWS_BN||{}, cats=window.TC_CATEGORIES_BN||{};
 const bn=false, query=new URLSearchParams(location.search), id=query.get('post');
 const record=raw.find(x=>x.id===id), root=document.getElementById('story-view'); if(!root)return;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const localized=x=>bn&&translations[x.id]?{...x,...translations[x.id]}:x;
 const category=c=>bn?(cats[c]||c):c;
 const other=bn?'blog.html':'blog_bn.html', archive=bn?'blogs_bn.html':'blogs.html';
 const lang=bn?'EN':'বাংলা', title=bn?'খবর খুঁজে পাওয়া যায়নি':'Story not found', shareLabel=bn?'শেয়ার':'Share', copyLabel=bn?'লিংক কপি':'Copy link';
 if(!record){root.innerHTML=`<div class="tc-story-notfound"><p class="tc-story-eyebrow">TRICHOKRO / JOURNAL</p><h1>${title}</h1><a href="${archive}">${bn?'← সব খবর দেখুন':'← Browse all stories'}</a></div>`;return;}
 const item=localized(record);

 const flagged=record.category==='Source Review'||record.external;
 const status=record.sourceStatus?(bn?'উৎস যাচাইয়ের অবস্থা: ':'Source status: ')+record.sourceStatus:'';

 document.title=item.title+' | TriChokro Automotives';document.querySelector('meta[name="description"]')?.setAttribute('content',item.excerpt);
 const languageLink=`<a class="tc-story-language" href="${other}?post=${encodeURIComponent(id)}" lang="${bn?'en':'bn'}" aria-label="${bn?'Read in English':'বাংলায় পড়ুন'}">${lang} ↔</a>`;
 const playVideo=record.videoId?`<div class="tc-article-video"><button class="tc-youtube-load" type="button" data-video="${esc(record.videoId)}" aria-label="${bn?'ভিডিও চালু করুন':'Play YouTube interview'}"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(record.videoId)}/hqdefault.jpg"><span>▶ ${bn?'সাক্ষাৎকার দেখুন':'Watch the interview'}</span></button><p>${bn?'ইউটিউবে ভিডিওটি এমবেড করার অনুমতি না থাকলে মূল উৎস লিংক ব্যবহার করুন।':'If the owner restricts embedding, open the original video using the source link.'}</p></div>`:'';
 root.innerHTML=`<div class="tc-story-crumb"><a href="index.html">${bn?'হোম':'Home'}</a><span>／</span><a href="${archive}">${bn?'সংবাদ':'Newsroom'}</a><span>／</span><span>${esc(category(record.category))}</span><span class="tc-spacer"></span>${languageLink}</div>
 <div class="tc-story-titlearea"><div class="tc-story-eyebrow"><span class="tc-story-dot"></span>${esc(category(record.category))} <span style="opacity:.5">/</span> ${esc(record.date)}</div><h1>${esc(item.title)}</h1><p class="tc-story-lead">${esc(item.excerpt)}</p><div class="tc-story-metadata"><span>${esc(record.date)}</span><span>${bn?'উৎস':'Source'}: ${esc(record.source)}</span><span>${bn?'ট্রাইচক্রো সম্পাদকীয়':'TriChokro editorial'}</span></div></div>
 <div class="tc-story-art"><small>TC / JOURNAL • ${esc(record.category.toUpperCase())}</small><div class="tc-story-art-title">${esc(category(record.category))}<span style="color:#6ce5c0">.</span></div></div>
 <div class="tc-story-content"><article class="tc-story-copy"><h2>${bn?'মূল প্রতিবেদন':'The story'}</h2>${item.body.map(p=>`<p>${esc(p)}</p>`).join('')}${playVideo}${flagged?`<div class="tc-story-callout"><strong>${bn?'সম্পাদকীয় নোট':'Editorial note'}:</strong> ${bn?'এই লিংককে ট্রাইচক্রোর নিশ্চিত তৃতীয় পক্ষের প্রচার হিসেবে উপস্থাপন করা হচ্ছে না।':'This source is not presented as confirmed TriChokro third-party coverage.'}</div>`:''}${status?`<div class="tc-story-review">${esc(status)}</div>`:''}<div class="tc-story-tags">${(record.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></article>
 <aside class="tc-story-side"><div class="tc-story-side-inner"><div class="tc-story-source-card"><div class="tc-story-side-label">${bn?'মূল উৎস':'ORIGINAL SOURCE'}</div><div class="tc-story-source-name">${esc(record.source)}</div><p class="tc-story-source-note">${esc(sourceKind)}. ${bn?'মূল লেখাটি হুবহু পুনঃপ্রকাশ করা হয়নি।':'This summary does not reproduce the source text in full.'}</p>${record.url?`<a class="tc-story-open" href="${esc(record.url)}" target="_blank" rel="noopener noreferrer">${bn?'মূল লিংক খুলুন':'Open original source'} <span aria-hidden="true">↗</span></a>`:`<span class="tc-story-open tc-no-source">${bn?'সাইটের পুরোনো সংবাদ':'Company archive item'}</span>`}</div>${record.metric?`<div class="tc-story-source-card"><div class="tc-story-side-label">${bn?'এক নজরে':'AT A GLANCE'}</div><div style="color:#5ee2be;font-size:27px;font-weight:600;margin:11px 0">${esc(record.metric)}</div><p class="tc-story-source-note">${esc(record.metricLabel||'')}</p></div>`:''}<div class="tc-story-actions"><button type="button" id="copy-story">${copyLabel} ↗</button><button type="button" id="share-story">${shareLabel} ↗</button></div></div></aside></div>
 ${related.length?`<div class="tc-story-rel"><h2>${bn?'আরও পড়ুন':'Continue reading'}</h2><div class="tc-story-relgrid">${related.map(x=>`<a href="${bn?'blog_bn.html':'blog.html'}?post=${encodeURIComponent(x.id)}"><small>${esc(category(x.category))}</small>${esc(x.title)} <span aria-hidden="true">↗</span></a>`).join('')}</div></div>`:''}`;
 document.querySelectorAll('.tc-youtube-load').forEach(btn=>btn.addEventListener('click',()=>{
 const video=btn.dataset.video; if(!/^[A-Za-z0-9_-]{11}$/.test(video))return;
 const box=document.createElement('div'); box.className='tc-video-frame';const iframe=document.createElement('iframe');iframe.src=`https://www.youtube-nocookie.com/embed/${video}?autoplay=1&rel=0`;iframe.title=bn?'ইউটিউব সাক্ষাৎকার':'YouTube interview';iframe.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allowFullscreen=true;box.append(iframe);btn.replaceWith(box);
 }));
 document.getElementById('copy-story')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy-story').textContent=bn?'লিংক কপি হয়েছে ✓':'Link copied ✓';}catch(e){window.prompt('Copy link',location.href)}});
 document.getElementById('share-story')?.addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:item.title,url:location.href});}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);document.getElementById('share-story').textContent=bn?'লিংক কপি হয়েছে ✓':'Link copied ✓';}catch(e){window.prompt('Copy link',location.href)}}});
})();
</script>
</body>
</html>
